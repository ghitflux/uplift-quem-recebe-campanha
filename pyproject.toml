[project]
name = "uplift-campanha"
version = "0.1.0"
description = "Para quem mandar a campanha? Modelagem de uplift num experimento aleatorizado de e-mail, comparada ao modelo de resposta comum"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.5",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jinja2>=3.1",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplift_campanha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
